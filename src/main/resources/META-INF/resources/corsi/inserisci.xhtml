<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Nuovo Corso</title>
    <meta charset="UTF-8" />
    <h:outputStylesheet library="css" name="style.css" />
</h:head>
<h:body>
    <div class="container-narrow">
        <div class="header-center">
            <h1>➕ Nuovo Corso</h1>
            <p>Aggiungi un nuovo elemento al sistema</p>
        </div>

        <div class="card-form">
            <h:form>
                <div class="form-group">
                    <h:outputLabel value="Nome:" for="nome" />
                    <p:inputText id="nome" value="#{corsoBean.corsoSelezionato.nome}" styleClass="form-input" />
                </div>

                <div class="form-group">
                    <h:outputLabel value="Descrizione:" for="desc" />
                    <p:inputTextarea id="desc" value="#{corsoBean.corsoSelezionato.descrizione}" rows="4"
                        styleClass="form-input" />
                </div>

                <div class="btn-group-centered">
                    <p:commandButton value="✓ Salva" action="#{corsoBean.saveCorso()}" update="@form"
                        styleClass="btn btn-primary" />
                    <p:button value="← Torna Indietro" outcome="lista" styleClass="btn btn-secondary" />
                </div>
            </h:form>
        </div>
    </div>
</h:body>

</html>
