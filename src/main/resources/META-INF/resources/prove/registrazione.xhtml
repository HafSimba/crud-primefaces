<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Registra Prova</title>
    <meta charset="UTF-8" />
    <h:outputStylesheet library="css" name="style.css" />
</h:head>
<h:body>
    <div class="container">
        <div class="header">
            <h1>📚 Registra Prova</h1>
            <p>Registra il risultato di un esame per uno studente</p>
        </div>

        <div class="card">
            <h:form id="registrationForm">
                <div class="form-row">
                    <div class="form-group">
                        <h:outputLabel value="Studente:" for="student" />
                        <p:selectOneMenu id="student" value="#{provaBean.studenteIdSelezionato}"
                            styleClass="form-input">
                            <f:selectItem itemLabel="-- Seleziona --" itemValue="#{null}" />
                            <f:selectItems value="#{provaBean.studenti}" var="s" itemLabel="#{s.nome} #{s.cognome}"
                                itemValue="#{s.id}" />
                        </p:selectOneMenu>
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="Corso:" for="course" />
                        <p:selectOneMenu id="course" value="#{provaBean.corsoIdSelezionato}" styleClass="form-input">
                            <f:selectItem itemLabel="-- Seleziona --" itemValue="#{null}" />
                            <f:selectItems value="#{provaBean.corsi}" var="c" itemLabel="#{c.nome}"
                                itemValue="#{c.id}" />
                        </p:selectOneMenu>
                    </div>

                    <div class="form-group">
                        <h:outputLabel value="Voto (1-30):" for="grade" />
                        <p:inputText id="grade" value="#{provaBean.votoInserito}" styleClass="form-input" />
                    </div>
                </div>

                <div class="btn-group">
                    <p:commandButton value="✓ Registra Prova" action="#{provaBean.registraProva()}"
                        update="registrationForm" styleClass="btn btn-primary" />
                    <p:button value="← Torna alla Home" outcome="/index" styleClass="btn btn-secondary" />
                </div>
            </h:form>
        </div>

        <div class="section-title">📄 Prove Registrate</div>
        <div class="card">
            <h:form>
                <p:dataTable var="prova" value="#{provaBean.prove}" styleClass="ui-datatable" rows="10"
                    paginator="true">
                    <p:column headerText="Studente" style="width: 25%">
                        <h:outputText value="#{prova.studente.nome} #{prova.studente.cognome}" />
                    </p:column>
                    <p:column headerText="Corso" style="width: 30%">
                        <h:outputText value="#{prova.corso.nome}" />
                    </p:column>
                    <p:column headerText="Voto" style="width: 15%">
                        <h:outputText value="#{prova.voto}" />
                    </p:column>
                    <p:column headerText="Data" style="width: 30%">
                        <h:outputText value="#{prova.data}" />
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>
    </div>
</h:body>

</html>
