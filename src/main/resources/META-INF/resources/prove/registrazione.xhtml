<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Registra Prova</title>
    <meta charset="UTF-8"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP&amp;display=swap" rel="stylesheet"/>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .line-seed-jp-regular {
            font-family: "LINE Seed JP", sans-serif;
            font-weight: 800;
            font-style: normal;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 8px;
            font-weight: 700;
            font-family: "LINE Seed JP", sans-serif;
        }
        
        .header p {
            font-size: 0.95rem;
            color: #888;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a1a;
            font-size: 0.95rem;
        }
        
        .form-group input,
        .form-group select {
            padding: 12px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #32936F;
            box-shadow: 0 0 0 3px rgba(50, 147, 111, 0.1);
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        
        .btn-primary {
            background: #32936F !important;
            color: white !important;
        }
        
        .btn-primary:hover {
            background: #287557 !important;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .section-title {
            font-size: 1.4rem;
            color: #1a1a1a;
            margin-top: 30px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
        }
        
        .ui-datatable {
            border: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .ui-datatable .ui-datatable-header {
            background: #f8f9fa;
            padding: 16px;
            border-bottom: 2px solid #e5e7eb;
            color: #1a1a1a;
            font-weight: 700;
        }
        
        .ui-datatable .ui-datatable-thead > tr > th {
            background: #f8f9fa;
            color: #1a1a1a;
            font-weight: 700;
            border-bottom: 2px solid #e5e7eb;
            padding: 16px;
        }
        
        .ui-datatable .ui-datatable-tbody > tr > td {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            color: #555;
        }
        
        .ui-datatable .ui-datatable-tbody > tr:hover {
            background: #f9f9f9;
        }
        
        .ui-selectonemenu > .ui-selectonemenu-label {
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
        }
    </style>
</h:head>
<h:body>
    <div class="container">
        <div class="header">
            <h1>📚 Registra Prova</h1>
            <p>Registra il risultato di un esame per uno studente</p>
        </div>
        
        <div class="card">
            <h:form id="registrationForm">
                <div class="form-row">
                    <div class="form-group">
                        <h:outputLabel value="Studente:" for="student"/>
                        <p:selectOneMenu id="student" value="#{provaBean.studenteIdSelezionato}" styleClass="form-input">
                            <f:selectItem itemLabel="-- Seleziona --" itemValue="#{null}"/>
                            <f:selectItems value="#{provaBean.studenti}" var="s" 
                                itemLabel="#{s.nome} #{s.cognome}" itemValue="#{s.id}"/>
                        </p:selectOneMenu>
                    </div>
                    
                    <div class="form-group">
                        <h:outputLabel value="Corso:" for="course"/>
                        <p:selectOneMenu id="course" value="#{provaBean.corsoIdSelezionato}" styleClass="form-input">
                            <f:selectItem itemLabel="-- Seleziona --" itemValue="#{null}"/>
                            <f:selectItems value="#{provaBean.corsi}" var="c" 
                                itemLabel="#{c.nome}" itemValue="#{c.id}"/>
                        </p:selectOneMenu>
                    </div>
                    
                    <div class="form-group">
                        <h:outputLabel value="Voto (1-30):" for="grade"/>
                        <p:inputText id="grade" value="#{provaBean.votoInserito}" styleClass="form-input"/>
                    </div>
                </div>
                
                <div class="btn-group">
                    <p:commandButton value="✓ Registra Prova" action="#{provaBean.registraProva()}" update="registrationForm" styleClass="btn btn-primary"/>
                    <p:button value="← Torna alla Home" outcome="/index" styleClass="btn btn-secondary"/>
                </div>
            </h:form>
        </div>
        
        <div class="section-title">📄 Prove Registrate</div>
        <div class="card">
            <h:form>
                <p:dataTable var="prova" value="#{provaBean.prove}" styleClass="ui-datatable" rows="10" paginator="true">
                    <p:column headerText="Studente" style="width: 25%">
                        <h:outputText value="#{prova.studente.nome} #{prova.studente.cognome}"/>
                    </p:column>
                    <p:column headerText="Corso" style="width: 30%">
                        <h:outputText value="#{prova.corso.nome}"/>
                    </p:column>
                    <p:column headerText="Voto" style="width: 15%">
                        <h:outputText value="#{prova.voto}"/>
                    </p:column>
                    <p:column headerText="Data" style="width: 30%">
                        <h:outputText value="#{prova.data}"/>
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>
    </div>
</h:body>
</html>
