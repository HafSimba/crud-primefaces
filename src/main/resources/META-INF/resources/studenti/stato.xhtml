<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Stato Studenti</title>
    <meta charset="UTF-8"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin"/>
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP&amp;display=swap" rel="stylesheet"/>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .line-seed-jp-regular {
            font-family: "LINE Seed JP", sans-serif;
            font-weight: 800;
            font-style: normal;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 8px;
            font-weight: 700;
            font-family: "LINE Seed JP", sans-serif;
        }
        
        .header p {
            font-size: 0.95rem;
            color: #888;
        }
        
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
        }
        
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
        }
        
        .ui-datatable {
            border: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        .ui-datatable .ui-datatable-header {
            background: #f8f9fa;
            padding: 16px;
            border-bottom: 2px solid #e5e7eb;
            color: #1a1a1a;
            font-weight: 700;
        }
        
        .ui-datatable .ui-datatable-thead > tr > th {
            background: #f8f9fa;
            color: #1a1a1a;
            font-weight: 700;
            border-bottom: 2px solid #e5e7eb;
            padding: 16px;
        }
        
        .ui-datatable .ui-datatable-tbody > tr > td {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            color: #555;
        }
        
        .ui-datatable .ui-datatable-tbody > tr:hover {
            background: #f9f9f9;
        }
    </style>
</h:head>
<h:body>
    <div class="container">
        <div class="header">
            <h1>📈 Stato Studenti</h1>
            <p>Visualizza medie, moduli mancanti e statistiche di tutti gli studenti</p>
        </div>
        
        <div class="card">
            <h:form>
                <p:dataTable var="stato" value="#{statiStudentiBean.statiStudenti}" styleClass="ui-datatable" rows="10" paginator="true">
                    <p:column headerText="Studente" style="width: 20%">
                        <h:outputText value="#{stato.studente.nome} #{stato.studente.cognome}"/>
                    </p:column>
                    <p:column headerText="Media Voti" style="width: 15%">
                        <h:outputText value="#{stato.mediaVotiFormatted}"/>
                    </p:column>
                    <p:column headerText="Superati" style="width: 12%">
                        <h:outputText value="#{stato.corsiSuperati}"/>
                    </p:column>
                    <p:column headerText="Falliti" style="width: 12%">
                        <h:outputText value="#{stato.corsiFalliti}"/>
                    </p:column>
                    <p:column headerText="Moduli Mancanti" style="width: 41%">
                        <p:dataList value="#{stato.moduliMancanti}" var="modulo" type="unordered">
                            <h:outputText value="#{modulo.nome}"/>
                        </p:dataList>
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>
        
        <div class="footer">
            <h:form>
                <p:button value="← Torna alla Home" outcome="/index" styleClass="btn btn-secondary"/>
            </h:form>
        </div>
    </div>
</h:body>
</html>
