spring.application.name=crud-primefaces

# Configurazione JSF / PrimeFaces (architettura JSF pura)
# Mapping solo su estensione .xhtml per evitare conflitti con endpoint tecnici (es. /error).
joinfaces.faces-servlet.url-mappings=*.xhtml

# Configurazione del database MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/esamedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Permette a JPA di creare/aggiornare automaticamente le tabelle nel DB in base alle tue classi Java
spring.jpa.hibernate.ddl-auto=update
# Mostra le query SQL nel terminale (molto utile per il debug)
spring.jpa.show-sql=true


