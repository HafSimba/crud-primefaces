spring.application.name=crud-primefaces

# Configurazione JSF / PrimeFaces (architettura JSF pura)
# Mapping solo su estensione .xhtml per evitare conflitti con endpoint tecnici (es. /error).
joinfaces.faces-servlet.url-mappings=*.xhtml

# Configurazione del database H2 in memoria
spring.datasource.url=jdbc:h2:mem:esamedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Permette a JPA di creare/aggiornare automaticamente le tabelle nel DB in base alle tue classi Java
spring.jpa.hibernate.ddl-auto=update
# Mostra le query SQL nel terminale (molto utile per il debug)
spring.jpa.show-sql=true

# Abilita la console web di H2 per vedere il database (raggiungibile a http://localhost:8080/h2-console)
spring.h2.console.enabled=true

