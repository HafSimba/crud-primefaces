<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Nuovo Studente</title>
</h:head>
<h:body>
    <h1>Inserisci Nuovo Studente</h1>
    
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="Nome:"/>
            <p:inputText value="#{studenteBean.studenteSelezionato.nome}"/>
            
            <h:outputLabel value="Cognome:"/>
            <p:inputText value="#{studenteBean.studenteSelezionato.cognome}"/>
            
            <h:outputLabel value="Email:"/>
            <p:inputText value="#{studenteBean.studenteSelezionato.email}"/>
        </h:panelGrid>
        
        <p:commandButton value="Salva" action="#{studenteBean.saveStudente()}" update="@form"/>
        <p:button value="Torna Indietro" outcome="lista"/>
    </h:form>
</h:body>
</html>
