<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/layout/template.xhtml">

    <ui:define name="title">Lista Studenti</ui:define>

    <ui:define name="content">
        <h:form>
            <p:panel header="📋 Elenco Studenti" style="margin-bottom: 20px;">
                
                <!-- Pulsante per aggiungere nuovo studente -->
                <div style="margin-bottom: 15px;">
                    <p:commandButton value="➕ Nuovo Studente" 
                                     action="#{ studenteBean.newStudente()}"
                                     oncomplete="PF('dlg').show()"
                                     icon="pi pi-plus" />
                </div>

                <!-- Tabella Studenti -->
                <p:dataTable var="studente" value="#{ studenteBean.studenti}"
                             responsiveLayout="scroll"
                             paginator="true"
                             rows="10"
                             emptyMessage="Nessuno studente trovato"
                             currentPageReportTemplate="{currentPage} di {totalPages}">

                    <p:column headerText="ID" sortBy="#{ studente.id}" style="width: 50px">
                        <h:outputText value="#{ studente.id}"/>
                    </p:column>

                    <p:column headerText="Nome" sortBy="#{ studente.nome}">
                        <h:outputText value="#{ studente.nome}"/>
                    </p:column>

                    <p:column headerText="Cognome" sortBy="#{ studente.cognome}">
                        <h:outputText value="#{ studente.cognome}"/>
                    </p:column>

                    <p:column headerText="Email">
                        <h:outputText value="#{ studente.email}"/>
                    </p:column>

                    <p:column headerText="Azioni" style="width: 150px">
                        <p:commandButton icon="pi pi-pencil" 
                                        action="#{ studenteBean.selectStudente(studente)}"
                                        oncomplete="PF('dlg').show()"
                                        title="Modifica"
                                        styleClass="p-button-rounded p-button-warning p-mr-2" />
                        <p:commandButton icon="pi pi-trash" 
                                        action="#{ studenteBean.deleteStudente(studente.id)}"
                                        title="Elimina"
                                        styleClass="p-button-rounded p-button-danger"
                                        onclick="return confirm('Sei sicuro di voler eliminare questo studente?');"/>
                    </p:column>
                </p:dataTable>

            </p:panel>
        </h:form>

        <!-- Dialog per inserimento/modifica -->
        <h:form enctype="multipart/form-data">
            <p:dialog header="Studente" widgetVar="dlg" modal="true" showEffect="fade" hideEffect="fade">
                <h:panelGrid columns="2" cellpadding="5">

                    <h:outputLabel for="nome" value="Nome *"/>
                    <p:inputText id="nome" value="#{ studenteBean.studenteSelezionato.nome}" required="true"/>

                    <h:outputLabel for="cognome" value="Cognome *"/>
                    <p:inputText id="cognome" value="#{ studenteBean.studenteSelezionato.cognome}" required="true"/>

                    <h:outputLabel for="email" value="Email"/>
                    <p:inputText id="email" value="#{ studenteBean.studenteSelezionato.email}" type="email"/>

                </h:panelGrid>

                <f:facet name="footer">
                    <p:commandButton value="Salva" action="#{ studenteBean.saveStudente()}"
                                     update=":form:datatable" onclick="PF('dlg').hide()"/>
                    <p:commandButton value="Annulla" onclick="PF('dlg').hide();" type="button"/>
                </f:facet>
            </p:dialog>
        </h:form>

    </ui:define>

</ui:composition>
</html>
