<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Stato Studenti</title>
</h:head>
<h:body>
    <h1>Stato Studenti</h1>
    
    <h:form>
        <p:dataTable var="stato" value="#{statiStudentiBean.statiStudenti}">
            <p:column headerText="Studente">
                <h:outputText value="#{stato.studente.nome} #{stato.studente.cognome}"/>
            </p:column>
            <p:column headerText="Media Voti">
                <h:outputText value="#{stato.mediaVotiFormatted}"/>
            </p:column>
            <p:column headerText="Superati">
                <h:outputText value="#{stato.corsiSuperati}"/>
            </p:column>
            <p:column headerText="Falliti">
                <h:outputText value="#{stato.corsiFalliti}"/>
            </p:column>
            <p:column headerText="Moduli Mancanti">
                <p:dataList value="#{stato.moduliMancanti}" var="mod">
                    <h:outputText value="#{mod.nome}"/>
                </p:dataList>
            </p:column>
        </p:dataTable>
    </h:form>
    
    <h:form>
        <p:button value="Home" outcome="index"/>
    </h:form>
</h:body>
</html>
