<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Lista Corsi</title>
</h:head>
<h:body>
    <h1>Lista Corsi</h1>
    
    <h:form>
        <p:button value="Nuovo Corso" outcome="inserisci"/>
        
        <p:dataTable var="c" value="#{corsoBean.corsi}">
            <p:column headerText="ID">
                <h:outputText value="#{c.id}"/>
            </p:column>
            <p:column headerText="Nome">
                <h:outputText value="#{c.nome}"/>
            </p:column>
            <p:column headerText="Descrizione">
                <h:outputText value="#{c.descrizione}"/>
            </p:column>
            <p:column headerText="Azioni">
                <p:commandButton value="Elimina" action="#{corsoBean.deleteCorso(c.id)}" update="@form"/>
            </p:column>
        </p:dataTable>
    </h:form>
    
    <h:form>
        <p:button value="Home" outcome="index"/>
    </h:form>
</h:body>
</html>
