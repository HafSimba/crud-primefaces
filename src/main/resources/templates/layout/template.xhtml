<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>
        <ui:insert name="title">CRUD - Gestione Esami</ui:insert>
    </title>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>📚 Sistema Gestione Esami Studenti</h1>
            <p class="subtitle">Primefaces + JSF + Spring Boot</p>
        </div>

        <!-- MENU NAVIGAZIONE -->
        <div class="navbar">
            <h:form>
                <p:menubar>
                    <p:menuitem value="Home" icon="pi pi-home" outcome="index"/>
                    
                    <p:submenu label="Studenti" icon="pi pi-users">
                        <p:menuitem value="Lista Studenti" icon="pi pi-list" outcome="studenti/lista"/>
                        <p:menuitem value="Nuovo Studente" icon="pi pi-plus" outcome="studenti/inserisci"/>
                    </p:submenu>

                    <p:submenu label="Corsi" icon="pi pi-bookmark">
                        <p:menuitem value="Lista Corsi" icon="pi pi-list" outcome="corsi/lista"/>
                        <p:menuitem value="Nuovo Corso" icon="pi pi-plus" outcome="corsi/inserisci"/>
                    </p:submenu>

                    <p:submenu label="Prove" icon="pi pi-check-square">
                        <p:menuitem value="Registra Prova" icon="pi pi-plus" outcome="prove/registrazione"/>
                        <p:menuitem value="Stato Studenti" icon="pi pi-chart-bar" outcome="studenti/stato"/>
                    </p:submenu>
                </p:menubar>
            </h:form>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <ui:insert name="content">
                <!-- Inserito dalle pagine figlie -->
            </ui:insert>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <p>© 2026 - CRUD PrimeFaces - Gestione Esami Studenti</p>
        </div>
    </div>
</h:body>
</html>
