<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<ui:composition template="/layout/template.xhtml">

    <ui:define name="title">Registrazione Prova</ui:define>

    <ui:define name="content">
        <h:form id="registrazioneForm">
            
            <!-- Sezione Registrazione Prova -->
            <p:panel header="✅ Registra Prova Esame" style="margin-bottom: 20px;">
                
                <p:messages id="messages" showDetail="true" closable="true"/>

                <h:panelGrid columns="3" cellpadding="5" style="margin-bottom: 20px">

                    <h:outputLabel for="studente" value="Studente *"/>
                    <p:selectOneMenu id="studente" value="#{ provaBean.studenteIdSelezionato}" 
                                    required="true" requiredMessage="Selezionare uno studente">
                        <f:selectItem itemLabel="-- Seleziona Studente --" itemValue="#{null}"/>
                        <f:selectItems value="#{ provaBean.studenti}" var="s"
                                      itemLabel="#{ s.nome} #{ s.cognome} (ID: #{ s.id})" itemValue="#{ s.id}"/>
                    </p:selectOneMenu>
                    <p:message for="studente"/>

                    <h:outputLabel for="corso" value="Corso *"/>
                    <p:selectOneMenu id="corso" value="#{ provaBean.corsoIdSelezionato}"
                                    required="true" requiredMessage="Selezionare un corso">
                        <f:selectItem itemLabel="-- Seleziona Corso --" itemValue="#{null}"/>
                        <f:selectItems value="#{ provaBean.corsi}" var="c"
                                      itemLabel="#{ c.nome}" itemValue="#{ c.id}"/>
                    </p:selectOneMenu>
                    <p:message for="corso"/>

                    <h:outputLabel for="voto" value="Voto (1-30) *"/>
                    <p:spinnerNumber id="voto" value="#{ provaBean.votoInserito}"
                                    min="1" max="30" required="true"
                                    requiredMessage="Voto obbligatorio"/>
                    <p:message for="voto"/>

                </h:panelGrid>

                <h:panelGroup rendered="#{ provaBean.messaggioErrore ne null}">
                    <p:outputPanel styleClass="ui-message ui-message-error" style="margin-bottom: 15px">
                        <h:outputText value="#{ provaBean.messaggioErrore}"/>
                    </p:outputPanel>
                </h:panelGroup>

                <p:commandButton value="✅ Registra Prova" 
                                 action="#{ provaBean.registraProva()}"
                                 update="registrazioneForm"
                                 icon="pi pi-check"
                                 styleClass="p-button-success"/>
                
                <p:spacer width="10" height="0"/>
                
                <p:commandButton value="🔄 Nuova Prova" 
                                 action="#{ provaBean.newProva()}"
                                 update="registrazioneForm"
                                 icon="pi pi-refresh"
                                 styleClass="p-button-info"/>

            </p:panel>

            <!-- Sezione Elenco Prove Registrate -->
            <p:panel header="📋 Prove Registrate" style="margin-bottom: 20px;">
                
                <p:dataTable var="prova" value="#{ provaBean.prove}"
                             responsiveLayout="scroll"
                             paginator="true"
                             rows="10"
                             emptyMessage="Nessuna prova registrata"
                             currentPageReportTemplate="{currentPage} di {totalPages}">

                    <p:column headerText="ID" sortBy="#{ prova.id}" style="width: 50px">
                        <h:outputText value="#{ prova.id}"/>
                    </p:column>

                    <p:column headerText="Studente" sortBy="#{ prova.studente.nome}">
                        <h:outputText value="#{ prova.studente.nome} #{ prova.studente.cognome}"/>
                    </p:column>

                    <p:column headerText="Corso" sortBy="#{ prova.corso.nome}">
                        <h:outputText value="#{ prova.corso.nome}"/>
                    </p:column>

                    <p:column headerText="Voto" style="width: 80px">
                        <h:outputText value="#{ prova.voto}" style="font-weight: bold; font-size: 1.1em"/>
                        <p:outputPanel rendered="#{ prova.voto ge 18}">
                            <p:outputPanel styleClass="ui-badge ui-badge-success" style="margin-left: 10px">
                                ✓ SUPERATO
                            </p:outputPanel>
                        </p:outputPanel>
                        <p:outputPanel rendered="#{ prova.voto lt 18}">
                            <p:outputPanel styleClass="ui-badge ui-badge-danger" style="margin-left: 10px">
                                ✗ FALLITO
                            </p:outputPanel>
                        </p:outputPanel>
                    </p:column>

                    <p:column headerText="Data">
                        <h:outputText value="#{ prova.data}"/>
                    </p:column>

                    <p:column headerText="Azioni" style="width: 100px">
                        <p:commandButton icon="pi pi-trash" 
                                        action="#{ provaBean.deleteProva(prova.id)}"
                                        update="registrazioneForm"
                                        title="Elimina"
                                        styleClass="p-button-rounded p-button-danger"
                                        onclick="return confirm('Sei sicuro di voler eliminare questa prova?');"/>
                    </p:column>
                </p:dataTable>

            </p:panel>

        </h:form>
    </ui:define>

</ui:composition>
</html>
