<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Registra Prova</title>
</h:head>
<h:body>
    <h1>Registra Prova</h1>
    
    <h:form>
        <h:panelGrid columns="2">
            <h:outputLabel value="Studente:"/>
            <p:selectOneMenu value="#{provaBean.studenteIdSelezionato}">
                <f:selectItem itemLabel="-- Seleziona --" itemValue="#{null}"/>
                <f:selectItems value="#{provaBean.studenti}" var="s" 
                    itemLabel="#{s.nome} #{s.cognome}" itemValue="#{s.id}"/>
            </p:selectOneMenu>
            
            <h:outputLabel value="Corso:"/>
            <p:selectOneMenu value="#{provaBean.corsoIdSelezionato}">
                <f:selectItem itemLabel="-- Seleziona --" itemValue="#{null}"/>
                <f:selectItems value="#{provaBean.corsi}" var="c" 
                    itemLabel="#{c.nome}" itemValue="#{c.id}"/>
            </p:selectOneMenu>
            
            <h:outputLabel value="Voto:"/>
            <p:inputText value="#{provaBean.votoInserito}"/>
        </h:panelGrid>
        
        <p:commandButton value="Registra" action="#{provaBean.registraProva()}" update="@form"/>
        <p:button value="Home" outcome="index"/>
    </h:form>
    
    <h2>Prove Registrate</h2>
    <p:dataTable var="prova" value="#{provaBean.prove}">
        <p:column headerText="Studente">
            <h:outputText value="#{prova.studente.nome} #{prova.studente.cognome}"/>
        </p:column>
        <p:column headerText="Corso">
            <h:outputText value="#{prova.corso.nome}"/>
        </p:column>
        <p:column headerText="Voto">
            <h:outputText value="#{prova.voto}"/>
        </p:column>
        <p:column headerText="Data">
            <h:outputText value="#{prova.data}"/>
        </p:column>
    </p:dataTable>
</h:body>
</html>
